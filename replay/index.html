<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinder / simulation replay</title><link rel="stylesheet" href="style.css"><script src="demo-data.js" defer></script><script src="replay.js" defer></script></head><body><main><header><span class="mark">↗</span><div><p>PATHFINDER / RECORDED SIMULATION</p><h1 id="title">Simulation replay</h1></div></header><p class="notice">PRE-RECORDED · SIMULATION ONLY · NO HARDWARE CONTROL</p><p id="error" role="alert" hidden></p><div class="layout"><section><svg id="scene" viewBox="0 0 700 580" role="img" aria-label="Recorded robot arm and workspace schematic"></svg><div class="transport"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Replay position"><output id="time">0.0 s</output><select id="speed" aria-label="Replay speed"><option value="1">1×</option><option value="2">2×</option><option value="0.5">½×</option></select></div><label>Open exported replay JSON <input id="file" type="file" accept="application/json,.json"></label><p id="limits"></p></section><aside><h2>Hand gate</h2><strong id="gate">—</strong><progress id="scale" max="1" value="0"></progress><p id="metrics"></p><h2>Runtime timeline</h2><ol id="timeline"></ol></aside></div></main></body></html>
