[project]
name = "lookandpick"
version = "0.1.0"
description = "A table-mounted SO-101 arm that works safely around people."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
vision = ["opencv-contrib-python", "numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["lookandpick", "lookandpick.adapters"]

[tool.setuptools.package-data]
lookandpick = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*.svg", "web/assets/fonts/*.ttf", "web/assets/fonts/*.txt"]
